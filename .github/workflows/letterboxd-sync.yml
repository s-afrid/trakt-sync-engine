name: Trakt Sync Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: trakt-sync-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync through the Vercel endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_ENDPOINT: https://trakt-sync-engine.vercel.app/api/sync/trigger
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi

          set -o pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            "$SYNC_ENDPOINT" | jq .
