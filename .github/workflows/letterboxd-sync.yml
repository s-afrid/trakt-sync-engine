name: 15-Minute Trakt Cloud Sync (MAL & Letterboxd)

on:
  schedule:
    # Run every 15 minutes automatically in GitHub's cloud
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows 1-click manual trigger from GitHub web / mobile app anytime

concurrency:
  group: trakt-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  secrets: write   # needed so the script can auto-refresh LETTERBOXD_SESSION_JSON

jobs:
  sync:
    name: Sync Trakt ➔ Letterboxd & MAL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browser Binary
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Restore Letterboxd Session & Diff State
        uses: actions/cache@v4
        with:
          path: |
            .letterboxd_sync_state.json
            .letterboxd_session.json
          key: lb-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lb-state-${{ runner.os }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: Install Chromium OS System Libraries (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Run Trakt ➔ Letterboxd & MAL Cloud Sync
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID || 'LJ3u_lRoHsyvfFiUbthSJ7Tk45uEgA_kQEQ5Yz57Ci0' }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET || '3C-UsSsW_BkGARa5bJ8c0HW9M7MzlLtfIqcKgonoXOo' }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME || 'afsindbad' }}
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME || 'Af_Sindbad' }}
          LETTERBOXD_PASSWORD: ${{ secrets.LETTERBOXD_PASSWORD || 'Af02052002' }}
          LETTERBOXD_SESSION_JSON: ${{ secrets.LETTERBOXD_SESSION_JSON }}
          LETTERBOXD_PROXY: ${{ secrets.LETTERBOXD_PROXY }}
          NEXT_PUBLIC_APP_URL: "https://trakt-sync-engine.vercel.app"
          PYTHONUNBUFFERED: "1"
          # Passed so the script can auto-refresh the session secret after login
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" python scripts/automate_letterboxd_upload.py --auto-confirm --keep-open 5

