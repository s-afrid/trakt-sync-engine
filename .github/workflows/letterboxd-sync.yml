name: Trakt Sync Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: vercel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run Trakt sync engine
        env:
          SYNC_APP_URL: ${{ vars.SYNC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET repository Actions secret."
            exit 1
          fi

          BASE_URL="${SYNC_APP_URL:-https://trakt-sync-engine.vercel.app}"
          echo "Starting sync engine at ${BASE_URL%/}/api/cron/sync"
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o "$RESPONSE_FILE" -w "%{http_code}" \
            "${BASE_URL%/}/api/cron/sync")"
          echo "Sync engine response (HTTP ${HTTP_STATUS}):"
          cat "$RESPONSE_FILE"
          echo
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi
