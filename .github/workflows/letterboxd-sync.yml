name: Trakt Sync Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: trakt-sync-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Letterboxd sync state
        uses: actions/cache/restore@v4
        with:
          path: .letterboxd_sync_state.json
          key: letterboxd-sync-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: letterboxd-sync-state-

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run one Letterboxd sync cycle
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}
          LETTERBOXD_PASSWORD: ${{ secrets.LETTERBOXD_PASSWORD }}
          LETTERBOXD_SESSION_JSON: ${{ secrets.LETTERBOXD_SESSION_JSON }}
          STREMBOXD_USERNAME: ${{ secrets.STREMBOXD_USERNAME }}
          STREMBOXD_PASSWORD: ${{ secrets.STREMBOXD_PASSWORD }}
          NEXT_PUBLIC_APP_URL: https://trakt-sync-engine.vercel.app
        run: python scripts/automate_letterboxd_upload.py --auto-confirm --headless

      - name: Save Letterboxd sync state
        if: always() && hashFiles('.letterboxd_sync_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .letterboxd_sync_state.json
          key: letterboxd-sync-state-${{ github.run_id }}-${{ github.run_attempt }}
