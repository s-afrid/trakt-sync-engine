name: Trakt Sync Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: trakt-sync-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Trakt to Letterboxd sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://trakt-sync-engine.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET is required."
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "$APP_URL/api/cron/sync"
